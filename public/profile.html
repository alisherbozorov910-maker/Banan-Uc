<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - PUBG UC Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container">
  <h2 class="mt-4" data-i18n="profile_title">Mening profilim</h2>

  <div class="card mt-3" style="max-width:500px;">
    <h3 data-i18n="settings_title">Sozlamalar</h3>
    <div id="settings-error" class="alert alert-error hidden"></div>
    <div id="settings-success" class="alert alert-success hidden"></div>

    <div class="field">
      <label data-i18n="settings_username">Username</label>
      <input type="text" id="settings-username">
    </div>
    <button class="btn btn-ghost" id="username-save-btn" data-i18n="settings_username_save">Username'ni saqlash</button>

    <div class="field mt-4">
      <label data-i18n="settings_email">Email (ixtiyoriy, parol tiklash uchun)</label>
      <input type="email" id="settings-email" placeholder="misol@gmail.com">
    </div>
    <button class="btn btn-ghost" id="email-save-btn" data-i18n="settings_email_save">Emailni saqlash</button>

    <div class="field mt-4">
      <label data-i18n="settings_current_password">Joriy parol</label>
      <input type="password" id="current-password">
    </div>
    <div class="field">
      <label data-i18n="settings_new_password">Yangi parol</label>
      <input type="password" id="new-password">
    </div>
    <button class="btn btn-ghost" id="password-save-btn" data-i18n="settings_password_save">Parolni yangilash</button>
  </div>
</div>

<script src="/js/space-background.js"></script>
<script src="/js/space-sound.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
let user = null;

async function loadProfile() {
  user = await renderNavbar('profile');
  if (!user) { window.location.href = '/login.html'; return; }
  document.getElementById('settings-username').value = user.username;
  document.getElementById('settings-email').value = user.email || '';
}

document.getElementById('email-save-btn').addEventListener('click', async () => {
  const email = document.getElementById('settings-email').value.trim();
  const errBox = document.getElementById('settings-error');
  const okBox = document.getElementById('settings-success');
  errBox.classList.add('hidden');
  okBox.classList.add('hidden');
  try {
    await api('/auth/email', { method: 'PUT', body: { email } });
    okBox.textContent = 'Email saqlandi';
    okBox.classList.remove('hidden');
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  }
});

document.getElementById('username-save-btn').addEventListener('click', async () => {
  const username = document.getElementById('settings-username').value.trim();
  const errBox = document.getElementById('settings-error');
  const okBox = document.getElementById('settings-success');
  errBox.classList.add('hidden');
  okBox.classList.add('hidden');
  try {
    await api('/auth/username', { method: 'PUT', body: { username } });
    okBox.textContent = 'Username yangilandi';
    okBox.classList.remove('hidden');
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  }
});

document.getElementById('password-save-btn').addEventListener('click', async () => {
  const current_password = document.getElementById('current-password').value;
  const new_password = document.getElementById('new-password').value;
  const errBox = document.getElementById('settings-error');
  const okBox = document.getElementById('settings-success');
  errBox.classList.add('hidden');
  okBox.classList.add('hidden');
  try {
    await api('/auth/password', { method: 'PUT', body: { current_password, new_password } });
    okBox.textContent = 'Parol yangilandi';
    okBox.classList.remove('hidden');
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  }
});

loadProfile();
</script>
</body>
</html>
