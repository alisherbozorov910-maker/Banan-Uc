<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top reyting - PUBG UC Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container">
  <h2 class="mt-4" data-i18n="leaderboard_title">Top reyting</h2>
  <p class="text-dim" data-i18n="leaderboard_subtitle">Eng ko'p UC xarid qilgan 10 ta foydalanuvchi</p>

  <div class="card mt-3" style="max-width:600px;margin:0 auto;">
    <div id="leaderboard-list"></div>
  </div>
</div>

<script src="/js/space-background.js"></script>
<script src="/js/space-sound.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script>
const MEDALS = ['🥇', '🥈', '🥉'];

async function loadLeaderboard() {
  const user = await renderNavbar();
  if (!user) { window.location.href = '/login.html'; return; }

  const { leaderboard } = await api('/leaderboard');
  const list = document.getElementById('leaderboard-list');

  if (!leaderboard.length) {
    list.innerHTML = `<p class="text-dim text-center">Hozircha hech kim UC xarid qilmagan</p>`;
    return;
  }

  list.innerHTML = leaderboard.map((row, i) => `
    <div class="flex items-center justify-between" style="padding:14px 8px;border-bottom:1px solid rgba(255,255,255,0.08);">
      <div class="flex items-center gap-2">
        <span style="font-size:20px;width:32px;text-align:center;">${MEDALS[i] || (i + 1)}</span>
        <span style="font-weight:700;">${row.username}</span>
      </div>
      <div style="text-align:right;">
        <div style="color:var(--accent);font-weight:800;">${row.total_uc} UC</div>
        <div class="text-dim" style="font-size:11px;">${row.order_count} ta buyurtma</div>
      </div>
    </div>
  `).join('');
}

loadLeaderboard();
</script>
</body>
</html>
